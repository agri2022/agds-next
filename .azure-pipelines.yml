# .azure-pipelines.yml (clean, block-style)

trigger:
  branches:
    include:
      - main
  paths:
    exclude:
      - docs/*
      - '**/*.md'

pr:
  branches:
    include:
      - main

parameters:
- name: feedName
  type: string
  default: ECM-UI-Feed

- name: nodeVersion
  type: string
  default: '20.x'

variables:
  FEED_NAME: ${{ parameters.feedName }}
  BaseVersion: '1.0.0'

name: $(Date:yyyyMMdd)$(Rev:.r)

pool:
  vmImage: ubuntu-latest

stages:
- stage: validate
  displayName: Validate & Test
  jobs:
  - job: test
    steps:
      - task: NodeTool@0
        inputs:
          versionSpec: ${{ parameters.nodeVersion }}
      - task: Npm@1
        displayName: npm ci
        inputs:
          command: ci
      - task: Npm@1
        displayName: npm test
        inputs:
          command: custom
          customCommand: test --if-present

- stage: package_and_publish
  displayName: Package & Publish to Azure Artifacts
  dependsOn: validate
  condition: succeeded()
  jobs:
  - job: publish
    steps:
      - task: NodeTool@0
        inputs:
          versionSpec: ${{ parameters.nodeVersion }}
      
      - task: PowerShell@2
        displayName: 'list files and folders'
        inputs:
          targetType: 'inline'
          script: |
            Get-ChildItem -Recurse | Select-Object FullName

      - task: npmAuthenticate@0
        displayName: NPM Authentication
        inputs:
          workingFile: .npmrc
          artifactFeeds: $(FEED_NAME)

      - task: Npm@1
        displayName: Set CI version
        inputs:
          command: custom
          customCommand: 'version $(BaseVersion)-$(Build.BuildId) --no-git-tag-version'
          
      - task: Npm@1
        displayName: npm pack
        inputs:
          command: custom
          customCommand: pack
      - task: Npm@1
        displayName: npm publish -> Azure Artifacts
        inputs:
          command: publish
          publishRegistry: useFeed
          publishFeed: $(FEED_NAME)