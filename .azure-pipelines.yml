# .azure-pipelines.yml (clean, block-style)

trigger:
  branches:
    include:
      - main
  paths:
    exclude:
      - docs/*
      - '**/*.md'

pr:
  branches:
    include:
      - main

parameters:
  - name: feed
    type: string
    default: 'Provide feed name'

variables:
  FEED_NAME: ${{ parameters.feed }}
  BaseVersion: '1.0.0'
  SOURCE_BRANCH: $[replace(variables['Build.SourceBranch'], 'refs/heads/', '')]

name: $(Date:yyyyMMdd)$(Rev:.r)

pool:
  vmImage: ubuntu-latest

stages:
- stage: validate
  displayName: Validate & Test
  jobs:
  - job: test
    steps:
      - task: NodeTool@0
        inputs:
          versionSpec: '20.x'
      - task: Npm@1
        displayName: npm ci
        inputs:
          command: ci
      - task: Npm@1
        displayName: npm test
        inputs:
          command: custom
          customCommand: test --if-present

- stage: package_and_publish
  displayName: Package & Publish to Azure Artifacts
  dependsOn: validate
  condition: succeeded()
  jobs:
  - job: publish
    steps:
      - checkout: self
        fetchDepth: 0

      # - bash: |
      #     set -euo pipefail
      #     UPSTREAM_URL="https://github.com/agriculturegovau/agds-next.git"
      #     UPSTREAM_BRANCH=$(SOURCE_BRANCH)

      #     git remote add upstream "$UPSTREAM_URL" || git remote set-url upstream "$UPSTREAM_URL"
      #     git fetch upstream "$UPSTREAM_BRANCH" --tags

      #     echo "Comparing fork HEAD to upstream/$UPSTREAM_BRANCH…"
      #     # behind ahead counts
      #     read BEHIND AHEAD < <(git rev-list --left-right --count HEAD...upstream/$UPSTREAM_BRANCH)
      #     echo "Behind: $BEHIND  Ahead: $AHEAD"

      #     if [ "$BEHIND" -gt 0 ]; then
      #       echo "##vso[task.logissue type=error]Fork is $BEHIND commits behind upstream/$UPSTREAM_BRANCH. Sync your fork, then retry."
      #       exit 1
      #     fi
      #   displayName: Validate fork is in sync with upstream

      - task: NodeTool@0
        inputs:
          versionSpec: '20.x'
      
      - task: PowerShell@2
        displayName: 'list files and folders'
        inputs:
          targetType: 'inline'
          script: |
            Get-ChildItem -Recurse | Select-Object FullName

      - task: npmAuthenticate@0
        displayName: NPM Authentication
        inputs:
          workingFile: '$(Agent.TempDirectory)/.npmrc'
          artifactFeeds: $(FEED_NAME)

      - task: Npm@1
        displayName: Set CI version
        inputs:
          command: custom
          customCommand: 'version $(BaseVersion)-$(Build.BuildId) --no-git-tag-version'
          
      - task: Npm@1
        displayName: npm pack
        inputs:
          command: custom
          customCommand: pack
      - task: Npm@1
        displayName: npm publish -> Azure Artifacts
        inputs:
          command: publish
          publishRegistry: useFeed
          publishFeed: $(FEED_NAME)
        env:
          NPM_CONFIG_USERCONFIG: '$(Agent.TempDirectory)/.npmrc'          